name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
